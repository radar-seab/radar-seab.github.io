name: Coletar notícias

on:
  schedule:
    - cron: "17 */2 * * *"  # a cada 2 horas
  workflow_dispatch:
    inputs:
      desde:
        description: "Carga retroativa a partir de (AAAA-MM-DD). Vazio = últimos 2 dias."
        required: false

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/test_coletar.py
          python scripts/coletar.py ${{ inputs.desde && format('--desde {0}', inputs.desde) || '' }}
      - name: Salvar
        run: |
          git config user.name "radar-seab-bot"
          git config user.email "radar-seab-bot@users.noreply.github.com"
          git add data/noticias.json
          git diff --cached --quiet || (git commit -m "dados: coleta $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
